services:
  rundb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rundb-server
    ports:
      - "7379:7379"
    restart: unless-stopped
    volumes:
      - rundb_data:/data
    environment:
      - RUNDB_PORT=7379
      - RUNDB_HOST=0.0.0.0
      - RUNDB_LOG_LEVEL=INFO
      - RUNDB_AOF_ENABLED=yes
      - RUNDB_AOF_FILE=/data/run_master.aof
      - RUNDB_AOF_FSYNC=everysec
      - RUNDB_SNAPSHOT_INTERVAL=1M
      - RUNDB_SNAPSHOT_FILE=/data/dump.rdb
      - RUNDB_MEMORY_LIMIT=0
      - RUNDB_EVICTION_STRATEGY=noeviction
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rundb_data:
    name: rundb_data
