# ==============================================================================
# RunDB Native Configuration File (rundb.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# Network & General Settings
# ------------------------------------------------------------------------------
# TCP port to listen on. Default: 7379
port 7379

# Network interface to bind to. Default: 127.0.0.1 (use 0.0.0.0 for all interfaces)
host 127.0.0.1

# Logging verbosity: TRACE, DEBUG, INFO, WARNING, ERROR. Default: INFO
log_level INFO

# Maximum number of concurrent connected clients. Default: 10000
max_clients 10000

# Number of isolated database partitions (0 to db_count - 1). Default: 16
db_count 16

# Periodic cron maintenance interval in seconds (for active TTL expiration). Default: 0.05
cron_freq_interval 0.05

# ------------------------------------------------------------------------------
# Memory Management & Eviction
# ------------------------------------------------------------------------------
# Memory limit in bytes (0 = unlimited). Default: 0
# Example for 100 MB: 104857600
memory_limit 0

# Eviction strategy when memory_limit is reached:
# - noeviction: Return an error when memory limit is reached
# - allkeys-lru: Evict least recently used key among all keys
# - volatile-lru: Evict least recently used key among keys with an expiration set
# - allkeys-random: Evict random key among all keys
# - volatile-random: Evict random key among keys with an expiration set
eviction_strategy noeviction

# LRU candidate pool size for approximated global eviction. Default: 16
eviction_pool_size 16

# Number of random keys sampled per database per eviction pass. Default: 5
eviction_sample_size 5

# Target fraction of keys to purge when eviction is triggered. Default: 0.1
eviction_ratio 0.1

# ------------------------------------------------------------------------------
# Append-Only File (AOF) Persistence
# ------------------------------------------------------------------------------
# Enable AOF persistence logging. Default: yes (yes/no)
aof_enabled yes

# Filename/path where AOF commands are recorded. Default: run_master.aof
aof_file run_master.aof

# fsync policy for disk writes:
# - always: fsync after every single write command (safest, lowest throughput)
# - everysec: fsync once per second in background (optimal balance)
# - no: rely on OS page cache flushing (highest throughput)
aof_fsync everysec

# ------------------------------------------------------------------------------
# Point-in-Time Compressed Snapshot (RDB) Persistence
# ------------------------------------------------------------------------------
# Automated periodic snapshot interval:
# Supports unit formats:
# - M: minutes (e.g. 1M for every 1 minute)
# - S: seconds (e.g. 30S for every 30 seconds)
# - H: hours (e.g. 2H for every 2 hours)
# - D: days (e.g. 1D for every 1 day)
# Set to 0 or leave empty to disable periodic snapshots. Default: 0 (disabled)
snapshot_interval 0

# Snapshot filename/path where compressed dump is stored. Default: dump.rdb
snapshot_file dump.rdb